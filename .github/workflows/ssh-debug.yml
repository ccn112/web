# =============================================================================
# TẠM THỜI — probe trạng thái runtime trên VPS. XOÁ khi deploy đã ổn định.
# =============================================================================
# CHỈ ĐỌC. Không chạy deploy.sh, không sửa gì, không cần approve
# (không gắn environment: production).
# Không set -e/-u và `exec 2>&1` -> không thể chết âm thầm.
name: SSH debug (tạm)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trạng thái runtime VPS (chỉ đọc)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 3m
          script_stop: false
          # ASCII thuần để loại rủi ro encoding.
          script: |
            exec 2>&1
            R="${{ secrets.VPS_PATH }}"

            echo "=== 1. AI / MOI TRUONG ==="
            echo "user=$(id -un) uid=$(id -u) host=$(hostname)"
            echo "uptime: $(uptime -p 2>/dev/null) | boot: $(who -b 2>/dev/null)"
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; nvm use --silent default 2>/dev/null; echo "nvm: CO"; else echo "nvm: KHONG CO"; fi
            export PATH="$HOME/.local/share/pnpm:/usr/local/bin:$PATH"
            echo "node: $(command -v node || echo KHONG-CO) $(node -v 2>/dev/null)"
            echo "pnpm: $(command -v pnpm || echo KHONG-CO) $(pnpm -v 2>/dev/null)"
            echo "pm2:  $(command -v pm2 || echo KHONG-CO) $(pm2 -v 2>/dev/null | tail -1)"

            echo "=== 2. QUYEN SO HUU REPO (chown xong chua) ==="
            ls -ld "$R" "$R/.git" 2>/dev/null || echo "khong doc duoc $R"
            echo "ghi duoc khong: $( [ -w "$R" ] && echo CO || echo KHONG )"

            echo "=== 3. CODE DANG O COMMIT NAO ==="
            git -C "$R" log -1 --oneline 2>/dev/null || echo "khong doc duoc git log"
            git -C "$R" status --short 2>/dev/null | head -10

            echo "=== 4. PM2 ==="
            if command -v pm2 >/dev/null 2>&1; then
              pm2 status 2>/dev/null || echo "pm2 status loi"
              echo "--- pm2 jlist (ten|status|restart|user) ---"
              pm2 jlist 2>/dev/null | tr ',' '\n' | grep -E '"name"|"status"|"restart_time"' | head -20
            else
              echo "pm2 KHONG CO tren PATH cua $(id -un)"
            fi
            ls -d "$HOME/.pm2" 2>/dev/null || echo "khong co $HOME/.pm2"

            echo "=== 5. AI GIU CONG 3000/3001 ==="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':300[01]' || echo "KHONG ai listen 3000/3001"

            echo "=== 6. HEALTH NOI BO ==="
            for p in 3000 3001; do
              echo "127.0.0.1:$p/api/health -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:$p/api/health 2>/dev/null || echo 000)"
            done

            echo "=== 7. LOG LOI GAN NHAT (20 dong) ==="
            if command -v pm2 >/dev/null 2>&1; then
              pm2 logs --nostream --lines 20 --err 2>/dev/null | tail -30 || echo "khong doc duoc pm2 logs"
            fi
            ls -t "$HOME/.pm2/logs/" 2>/dev/null | head -6

            echo "=== 8. BUILD DA CO CHUA ==="
            for d in apps/cms/.next apps/clay/.next; do
              if [ -d "$R/$d" ]; then echo "$d: CO ($(date -r "$R/$d" '+%F %H:%M' 2>/dev/null))"; else echo "$d: CHUA BUILD"; fi
            done

            echo "=== 9. CRON JOB RUNNER ==="
            crontab -l 2>/dev/null | grep -c 'payload-jobs-cron.sh' || echo "khong co crontab cho user nay"

            echo "=== 10. MIGRATION ==="
            DBURL="$(grep -E '^DATABASE_URL=' "$R/.env" 2>/dev/null | head -n1 | sed -E 's/^DATABASE_URL=//; s/^["'"'"']//; s/["'"'"']$//')"
            if [ -n "$DBURL" ] && command -v psql >/dev/null 2>&1; then
              psql "$DBURL" -tAc 'select name from payload_migrations order by id' 2>/dev/null \
                || echo "khong doc duoc payload_migrations"
            else
              echo "bo qua"
            fi

            echo "=== HET DIAG ==="
